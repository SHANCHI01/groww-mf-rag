<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearPulse: reviews into a weekly plan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0813;--card:#161024;--ink:#f3eefc;--mute:#b2a7c9;--line:#2c2140;--acc:#a97bff;--accsoft:#2a1b49;--ok:#7be0a8;--okbg:#14301f;--bad:#ff8f8f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.brand{font:800 20px "Bricolage Grotesque",sans-serif;display:flex;gap:10px;align-items:center}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#a97bff);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:600 15px inherit;font-family:inherit;border:0;background:none;color:var(--mute);padding:8px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--accsoft);color:var(--acc)}
nav button:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:32px clamp(16px,4vw,48px) 64px}
h1{font:800 clamp(34px,6vw,60px)/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 16px;max-width:15ch}
h2{font:800 26px "Bricolage Grotesque",sans-serif;margin:0 0 12px}
.lead{color:var(--mute);max-width:60ch;margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:28px 0}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:14px 16px}
.stat b{display:block;font:800 28px "Bricolage Grotesque",sans-serif}.stat span{color:var(--mute);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px);margin-bottom:16px}
.pulse p,.pulse li{max-width:70ch}.pulse h3{font:800 18px "Bricolage Grotesque",sans-serif;margin:20px 0 6px}
ul{padding-left:20px}li{margin:4px 0}
.btn{font:600 16px inherit;font-family:inherit;background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.btn[disabled]{background:var(--okbg);color:var(--ok);cursor:default}
.themes{counter-reset:t;padding:0;list-style:none}.themes li{padding:10px 0;border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font-size:13px;margin:8px 0 0}
.note{color:var(--mute);font-size:14px}.hide{display:none}
a{color:var(--acc)}footer{padding:24px clamp(16px,4vw,48px);border-top:1px solid var(--line);color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:no-preference){.panel{transition:border-color .2s}}
</style></head><body>
<header><div class="brand"><span class="logo"></span>ClearPulse</div>
<nav role="tablist" id="tabs"></nav></header>
<main id="app"></main>
<footer>ClearPulse is a static demo of saved results from a real run. Nothing is sent: the approval step writes to the page only. Code: <a href="https://github.com/SHANCHI01/groww-mf-rag">github.com/SHANCHI01/groww-mf-rag</a></footer>
<script>
const D = {"date": "2026-10-14", "range": "2026-10-14", "review_count": 10000, "top_themes": ["Transaction-charge transparency", "Positive user experience", "Performance and stability"], "weekly_pulse": "﻿# ClearPulse | The Monday Signal\n**Exploratory Product Pulse — 14 October 2026**\n\n## The signal\n\n**The opportunity:** Make transaction charges easier to understand.\n\n**The risk:** Customers may perceive brokerage and other deductions as unclear or expensive.\n\n## What customers are telling us\n\n- **Fee transparency:** 428 of 10,000 Groww reviews matched fee-related keywords.\n- **Negative sentiment:** 289 of those 428 reviews had ratings of 1 or 2.\n- **Customer experience:** Reviews describe difficulty viewing charge breakdowns and understanding deductions.\n\n*These are keyword-based exploratory counts, not validated theme classifications. The dataset has no review dates.*\n\n## The voice of the customer\n\n\u003e “there should be an option to view the breakup of charges deducted on sell and purchase in all transactions page”\n\n\u003e “everything not showing clearly and brokerage very high”\n\n\u003e “Charge extra money on stock sales. And the app also does not show the details of all the charges.”\n\n## Product insight\n\nCustomers may need clearer, transaction-level explanations of brokerage, statutory charges, and other applicable deductions. Complaints indicate a transparency concern, not proof of incorrect billing.\n\n## Three actions for next week\n\n1. **Audit the experience:** Check where customers can view their transaction-wise charge breakdown.\n2. **Clarify fees:** Validate explanations against official pricing information.\n3. **Validate the problem:** Review dated customer feedback and interview affected users before prioritizing a solution.\n\n**Data status:** Exploratory analysis; the required 8–12-week review window remains unverified.", "identified_fee_issue": "Transaction-charge transparency", "explanation_bullets": ["**Brokerage:** For regular equity trades, Groww lists brokerage as the lower of ₹20 or 0.1% of trade value, subject to the applicable minimum charge.", "**Other charges:** Exchange transaction charges, SEBI turnover charges, stamp duty, and Securities Transaction Tax (STT) may also apply, depending on the trade.", "**DP charges:** Selling shares from a demat account can attract DP charges per sell transaction.", "**GST:** GST applies to specified service charges, including brokerage and DP charges.", "**Why the total can vary:** The final amount depends on trade value, order type, buy or sell activity, applicable taxes, and other charges.", "**Where to verify:** Check the official pricing page and Groww's DP-charge explanation for the applicable rates and conditions."], "source_links": ["https://groww.in/pricing", "https://groww.in/help/stocks/searchable/when-are-dp-charges-levied"], "entry": {"date": "2026-10-14", "top_themes": ["Transaction-charge transparency", "Positive user experience", "Performance and stability"], "weekly_pulse": "# ClearPulse | The Monday Signal\n**Exploratory Product Pulse — 14 October 2026**\n\n## The signal\n\n**The opportunity:** Make transaction charges easier to understand.\n\n**The risk:** Customers may perceive brokerage and other deductions as unclear or expensive.\n\n## What customers are telling us\n\n- **Fee transparency:** 428 of 10,000 Groww reviews matched fee-related keywords.\n- **Negative sentiment:** 289 of those 428 reviews had ratings of 1 or 2.\n- **Customer experience:** Reviews describe difficulty viewing charge breakdowns and understanding deductions.\n\n*These are keyword-based exploratory counts, not validated theme classifications. The dataset has no review dates.*\n\n## The voice of the customer\n\n\u003e “there should be an option to view the breakup of charges deducted on sell and purchase in all transactions page”\n\n\u003e “everything not showing clearly and brokerage very high”\n\n\u003e “Charge extra money on stock sales. And the app also does not show the details of all the charges.”\n\n## Product insight\n\nCustomers may need clearer, transaction-level explanations of brokerage, statutory charges, and other applicable deductions. Complaints indicate a transparency concern, not proof of incorrect billing.\n\n## Three actions for next week\n\n1. **Audit the experience:** Check where customers can view their transaction-wise charge breakdown.\n2. **Clarify fees:** Validate explanations against official pricing information.\n3. **Validate the problem:** Review dated customer feedback and interview affected users before prioritizing a solution.\n\n**Data status:** Exploratory analysis; the required 8–12-week review window remains unverified.", "identified_fee_issue": "Transaction-charge transparency", "explanation_bullets": ["Brokerage: For regular equity trades, Groww lists brokerage as the lower of ₹20 or 0.1% of trade value, subject to the applicable minimum charge.", "Other charges: Exchange transaction charges, SEBI turnover charges, stamp duty, and Securities Transaction Tax (STT) may also apply, depending on the trade.", "DP charges: Selling shares from a demat account can attract DP charges per sell transaction.", "GST: GST applies to specified service charges, including brokerage and DP charges.", "Why the total can vary: The final amount depends on trade value, order type, buy or sell activity, applicable taxes, and other charges.", "Where to verify: Check the official pricing page and Groww's DP-charge explanation for the applicable rates and conditions."], "source_links": ["https://groww.in/pricing", "https://groww.in/help/stocks/searchable/when-are-dp-charges-levied"]}, "email_subject": "ClearPulse Weekly Product Pulse", "email_body": "Weekly Product Pulse\n\n# ClearPulse | The Monday Signal\n**Exploratory Product Pulse — 14 October 2026**\n\n## The signal\n\n**The opportunity:** Make transaction charges easier to understand.\n\n**The risk:** Customers may perceive brokerage and other deductions as unclear or expensive.\n\n## What customers are telling us\n\n- **Fee transparency:** 428 of 10,000 Groww reviews matched fee-related keywords.\n- **Negative sentiment:** 289 of those 428 reviews had ratings of 1 or 2.\n- **Customer experience:** Reviews describe difficulty viewing charge breakdowns and understanding deductions.\n\n*These are keyword-based exploratory counts, not validated theme classifications. The dataset has no review dates.*\n\n## The voice of the customer\n\n\u003e “there should be an option to view the breakup of charges deducted on sell and purchase in all transactions page”\n\n\u003e “everything not showing clearly and brokerage very high”\n\n\u003e “Charge extra money on stock sales. And the app also does not show the details of all the charges.”\n\n## Product insight\n\nCustomers may need clearer, transaction-level explanations of brokerage, statutory charges, and other applicable deductions. Complaints indicate a transparency concern, not proof of incorrect billing.\n\n## Three actions for next week\n\n1. **Audit the experience:** Check where customers can view their transaction-wise charge breakdown.\n2. **Clarify fees:** Validate explanations against official pricing information.\n3. **Validate the problem:** Review dated customer feedback and interview affected users before prioritizing a solution.\n\n**Data status:** Exploratory analysis; the required 8–12-week review window remains unverified.\n\n# Fee Explainer: Understanding Groww Equity Trading Charges\n\n- **Brokerage:** For regular equity trades, Groww lists brokerage as the lower of ₹20 or 0.1% of trade value, subject to the applicable minimum charge.\n- **Other charges:** Exchange transaction charges, SEBI turnover charges, stamp duty, and Securities Transaction Tax (STT) may also apply, depending on the trade.\n- **DP charges:** Selling shares from a demat account can attract DP charges per sell transaction.\n- **GST:** GST applies to specified service charges, including brokerage and DP charges.\n- **Why the total can vary:** The final amount depends on trade value, order type, buy or sell activity, applicable taxes, and other charges.\n- **Where to verify:** Check the official pricing page and Groww's DP-charge explanation for the applicable rates and conditions.\n\n**Customer issue:** Reviews indicate that some users find transaction-charge breakdowns difficult to understand. This is a reported transparency concern, not proof of incorrect billing.\n\n**Sources:**\n1. https://groww.in/pricing\n2. https://groww.in/help/stocks/searchable/when-are-dp-charges-levied\n\n**Last checked: 14 Oct 2026**\n", "evals": {}};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = t => esc(t).split(/\n{2,}/).map(b => {
  const lines = b.split("\n");
  if (lines.every(l => /^\s*[-*] /.test(l))) return "<ul>"+lines.map(l=>"<li>"+l.replace(/^\s*[-*] /,"")+"</li>").join("")+"</ul>";
  if (/^#{1,4} /.test(b)) return "<h3>"+b.replace(/^#{1,4} /,"")+"</h3>";
  return "<p>"+b.replace(/\n/g,"<br>")+"</p>";
}).join("").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const TABS = [["overview","Overview"],["pulse","Weekly pulse"],["fee","Fee explainer"],["approve","Approve & log"]];
let tab = "overview", approved = false;
const app = document.getElementById("app");
if (!D) { app.innerHTML = "<h1>No data yet</h1><p class='lead'>Run <code>python -m scripts.build_site</code> to fill this page from your deliverables.</p>"; }
else {
const words = D.weekly_pulse.trim().split(/\s+/).length;
function view() {
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) => `<button role="tab" aria-selected="${k===tab}" data-k="${k}">${l}</button>`).join("");
  if (tab==="overview") app.innerHTML = `
    <h1>${D.review_count.toLocaleString()} reviews, turned into a Monday plan.</h1>
    <p class="lead">Public Groww Play Store reviews from ${esc(D.range)} are sorted into themes, one fee people keep misreading is explained, and a person approves before anything is saved.</p>
    <div class="stats">
      <div class="stat"><b>${D.review_count.toLocaleString()}</b><span>reviews read</span></div>
      <div class="stat"><b>${D.top_themes.length}</b><span>top themes this week</span></div>
      <div class="stat"><b>1 fee</b><span>${esc(D.identified_fee_issue)}</span></div>
      <div class="stat"><b>${words} words</b><span>weekly pulse, limit 250</span></div>
      <div class="stat"><b id="w">${approved?2:0} writes</b><span>${approved?"approved by a person":"until a person approves"}</span></div>
    </div>
    <div class="panel"><h2>Top themes</h2><ol class="themes">${D.top_themes.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`;
  if (tab==="pulse") app.innerHTML = `<div class="panel pulse"><h2>Weekly product pulse</h2><p class="note">Week of ${esc(D.date)}. For the product team.</p>${md(D.weekly_pulse)}</div>`;
  if (tab==="fee") app.innerHTML = `<div class="panel pulse"><h2>${esc(D.identified_fee_issue)}</h2><p class="note">Reusable snippet for support. Facts only, no advice.</p><ul>${D.explanation_bullets.map(b=>`<li>${esc(b.replace(/^\s*[-*]\s*/,""))}</li>`).join("")}</ul><h3>Sources</h3><ul>${D.source_links.map(l=>`<li><a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a></li>`).join("")}</ul><p class="note">Last checked: ${esc(D.date)}</p></div>`;
  if (tab==="approve") app.innerHTML = `
    <div class="panel"><h2>Approve & log</h2>
      <p class="lead">Two actions are waiting. Nothing is written until you approve.</p>
      <ul><li>Append this week's entry to the notes document</li><li>Create an email draft (it is never sent)</li></ul>
      <button class="btn" id="ap" ${approved?"disabled":""}>${approved?"Approved and logged":"Approve & log"}</button></div>
    <div class="${approved?"":"hide"}" id="out">
      <div class="panel"><h2>Notes entry</h2><pre>${esc(JSON.stringify(D.entry,null,2))}</pre></div>
      <div class="panel"><h2>Email draft</h2><p class="note">Subject: ${esc(D.email_subject)}</p><pre>${esc(D.email_body)}</pre></div></div>
    <div class="panel"><h2>Checks</h2><table>${Object.entries(D.evals||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="${v?"pass":"fail"}">${v?"Pass":"Fail"}</td></tr>`).join("")}</table></div>`;
}
document.getElementById("tabs").addEventListener("click", e => { const k=e.target.dataset.k; if(k){tab=k;view();window.scrollTo(0,0);} });
app.addEventListener("click", e => { if(e.target.id==="ap"){approved=true;view();} });
view();
}
</script></body></html>
